apiVersion: enterprise.splunk.com/v4
kind: Standalone

metadata:
  name: splunk
  namespace: splunk
  finalizers:
    - enterprise.splunk.com/delete-pvc

spec:
  replicas: 1

  image: splunk/splunk:10.4.0
  imagePullPolicy: IfNotPresent

  extraEnv:
    - name: SPLUNK_START_ARGS
      value: "--accept-license"

    - name: SPLUNK_GENERAL_TERMS
      value: "--accept-sgt-current-at-splunk-com"

  etcVolumeStorageConfig:
    storageClassName: local-path
    storageCapacity: 10Gi

  varVolumeStorageConfig:
    storageClassName: local-path
    storageCapacity: 30Gi

  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  appRepo:
    appsRepoPollIntervalSeconds: 60

    defaults:
      scope: local
      volumeName: splunk-app-repo

    volumes:
      - name: splunk-app-repo
        storageType: s3
        provider: aws
        path: splunk-apps-789
        endpoint: https://s3.us-east-1.amazonaws.com
        region: us-east-1
        secretRef: splunk-s3-secret

    appSources:
      - name: core
        location: core

      - name: db
        location: db

      - name: monitoring
        location: monitoring

      - name: security
        location: security

      - name: custom
        location: custom